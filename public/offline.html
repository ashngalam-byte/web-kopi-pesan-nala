<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#083628" />
    <title>NALA Coffee Roastory — Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #e8d8c9;
        font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #083628;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 18px 40px -18px rgba(8, 54, 40, 0.35);
      }
      img {
        width: 132px;
        height: auto;
        margin-bottom: 16px;
      }
      h1 {
        font-family: 'Bree Serif', Georgia, serif;
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #6f6f6f;
        margin: 0 0 20px;
      }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #083628;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        background: #062a1f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/nala-logo.png" alt="NALA Coffee Roastory" />
      <h1>Tidak ada koneksi</h1>
      <p>
        Sepertinya kamu sedang offline. Sambungkan internet lagi, lalu muat ulang
        halaman untuk lanjut pesan kopi favoritmu.
      </p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
